
name: Build ClipForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - clipforge-ai-ui-upgrade

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.2.12479018"
          sdkmanager "cmake;3.22.1"

      - name: Find and extract project ZIP
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -iname '*SmartException*Fix*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ClipForge source ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d project

          test -f project/clipforge_src/settings.gradle.kts
          test -f project/clipforge_src/app/build.gradle.kts

      - name: Apply updated Kotlin files
        run: |
          ENGINE_SOURCE="OnDeviceClipEngine.kt"
          ACTIVITY_SOURCE="MainActivity.kt"

          ENGINE_TARGET="project/clipforge_src/app/src/main/java/com/clipforge/app/OnDeviceClipEngine.kt"
          ACTIVITY_TARGET="project/clipforge_src/app/src/main/java/com/clipforge/app/MainActivity.kt"

          for FILE in "$ENGINE_SOURCE" "$ACTIVITY_SOURCE" "$ENGINE_TARGET" "$ACTIVITY_TARGET"; do
            if [ ! -s "$FILE" ]; then
              echo "Required file missing or empty: $FILE"
              exit 1
            fi
          done

          cp "$ENGINE_SOURCE" "$ENGINE_TARGET"
          cp "$ACTIVITY_SOURCE" "$ACTIVITY_TARGET"

          echo "Both updated Kotlin files copied successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Smart Exception dependency
        working-directory: project/clipforge_src
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath > dependencies.txt
          grep -i "smart-exception-java" dependencies.txt

      - name: Build APK
        working-directory: project/clipforge_src
        run: |
          gradle --refresh-dependencies --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="project/clipforge_src/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK build failed or APK is missing"
            exit 1
          fi

          echo "APK successfully generated"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-AI-Upgrade-APK
          path: project/clipforge_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
