
name: Build ClipForge AI Crash Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Extract crash-fix project
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -type f -iname '*CrashFix*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Crash-fix ZIP not found"
            exit 1
          fi
          echo "Using $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project
          test -f project/clipforge_src/settings.gradle.kts
          test -f project/clipforge_src/app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build crash-fix APK
        working-directory: project/clipforge_src
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload crash-fix APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-AI-CrashFix-APK
          path: project/clipforge_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
