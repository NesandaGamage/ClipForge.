
name: Build ClipForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - clipforge-ai-ui-upgrade

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.2.12479018"
          sdkmanager "cmake;3.22.1"

      - name: Find and extract project ZIP
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -iname '*SmartException*Fix*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ClipForge source ZIP not found"
            exit 1
          fi

          echo "Using source ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          test -f project/clipforge_src/settings.gradle.kts
          test -f project/clipforge_src/app/build.gradle.kts

      - name: Install ClipForge logo assets
        run: |
          LOGO_ZIP="ClipForge_Logo_Assets.zip"

          if [ ! -f "$LOGO_ZIP" ]; then
            echo "ERROR: Logo ZIP not found"
            exit 1
          fi

          unzip -q "$LOGO_ZIP" -d logo_assets

          RES_DIR="project/clipforge_src/app/src/main/res"
          mkdir -p "$RES_DIR"

          for DIR in drawable drawable-nodpi mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi mipmap-anydpi-v26 values; do
            if [ -d "logo_assets/$DIR" ]; then
              mkdir -p "$RES_DIR/$DIR"
              cp -R "logo_assets/$DIR/." "$RES_DIR/$DIR/"
            fi
          done

          MANIFEST="project/clipforge_src/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text()

          content = content.replace(
              '<application ',
              '<application android:icon="@mipmap/ic_launcher" '
              'android:roundIcon="@mipmap/ic_launcher_round" ',
              1
          )

          path.write_text(content)
          PY

          echo "ClipForge launcher icon installed."

      - name: Apply updated Kotlin files
        run: |
          ENGINE_SOURCE="OnDeviceClipEngine.kt"
          ACTIVITY_SOURCE="MainActivity.kt"
          HEATMAP_SOURCE="YouTubeHeatmapExtractor.kt"

          SOURCE_DIR="project/clipforge_src/app/src/main/java/com/clipforge/app"

          ENGINE_TARGET="$SOURCE_DIR/OnDeviceClipEngine.kt"
          ACTIVITY_TARGET="$SOURCE_DIR/MainActivity.kt"
          HEATMAP_TARGET="$SOURCE_DIR/YouTubeHeatmapExtractor.kt"

          echo "Checking updated Kotlin source files..."

          for FILE in "$ENGINE_SOURCE" "$ACTIVITY_SOURCE" "$HEATMAP_SOURCE"; do
            if [ ! -s "$FILE" ]; then
              echo "ERROR: Required source file missing or empty: $FILE"
              exit 1
            fi
          done

          if [ ! -s "$ENGINE_TARGET" ]; then
            echo "ERROR: Original OnDeviceClipEngine.kt missing"
            exit 1
          fi

          if [ ! -s "$ACTIVITY_TARGET" ]; then
            echo "ERROR: Original MainActivity.kt missing"
            exit 1
          fi

          mkdir -p "$SOURCE_DIR"

          cp "$ENGINE_SOURCE" "$ENGINE_TARGET"
          cp "$ACTIVITY_SOURCE" "$ACTIVITY_TARGET"
          cp "$HEATMAP_SOURCE" "$HEATMAP_TARGET"

          echo "Checking heatmap extractor package..."

          head -n 5 "$HEATMAP_TARGET"

          if ! grep -q '^package com\.clipforge\.app$' "$HEATMAP_TARGET"; then
            echo "ERROR: Incorrect package declaration in YouTubeHeatmapExtractor.kt"
            exit 1
          fi

          echo "All three Kotlin files copied successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Smart Exception dependency
        working-directory: project/clipforge_src
        run: |
          gradle :app:dependencies --configuration debugRuntimeClasspath > dependencies.txt

          if ! grep -i "smart-exception-java" dependencies.txt; then
            echo "ERROR: Smart Exception dependency not found"
            exit 1
          fi

      - name: Build APK
        working-directory: project/clipforge_src
        run: |
          gradle --refresh-dependencies --stacktrace assembleDebug

      - name: Verify APK
        run: |
          APK="project/clipforge_src/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "APK build failed or APK is missing"
            exit 1
          fi

          echo "APK successfully generated"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-AI-Upgrade-APK
          path: project/clipforge_src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
